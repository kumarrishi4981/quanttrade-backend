# Production Profile - Render Deployment
# Uses PostgreSQL instead of H2

spring.application.name=QuantTrade

# PostgreSQL (Render provides these via environment variables)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quanttrade}
spring.datasource.username=${DB_USERNAME:quanttrade}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console disabled in production
spring.h2.console.enabled=false

# Server - Render sets PORT env var
server.port=${PORT:8081}

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# CORS - read from environment variable
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
